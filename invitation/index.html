<!doctype html>
<html lang="mul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J&amp;M 20.08.2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f1ece1; --cream-hi:#f8f5ee;
    --ink:#414a3e; --muted:#8b9081; --gold:#c6b392;
    --nl-red:#ae1c28; --nl-blue:#21468b; --at-red:#ed2939;
    --ease:cubic-bezier(.22,.61,.36,1);
    --hero-w:595; --hero-h:560;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font-family:"Jost",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100dvh;display:flex;flex-direction:column;
    background:radial-gradient(ellipse 80% 70% at 50% 40%, var(--cream-hi), var(--cream) 78%);overflow-x:hidden}

  .prompt{text-align:center;padding:clamp(20px,4.5vh,48px) 20px 0;font-family:"Cormorant Garamond",serif;line-height:1.12}
  .prompt .nl,.prompt .de{display:block;font-weight:500}
  .prompt .nl{font-size:clamp(1.5rem,3.2vw,2.3rem);color:var(--ink)}
  .prompt .de{font-size:clamp(1.35rem,2.9vw,2.05rem);color:#5c5142}
  .prompt .sep{display:block;width:46px;height:1px;margin:9px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  .names{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.8vw,28px);
    padding:0 20px;font-family:"Cormorant Garamond",serif}
  .names .name{font-size:clamp(2.1rem,5.2vw,3.4rem);font-weight:500;color:var(--ink);letter-spacing:.01em;line-height:1}
  .rings{display:inline-flex;color:var(--gold);flex:none}
  .rings svg{width:clamp(46px,7.6vw,66px);height:auto;display:block}
  .selhead{text-align:center;margin-bottom:4px}
  .sel-date{letter-spacing:.2em;font-size:clamp(.82rem,2.6vw,1rem);color:var(--muted)}
  .sel-names{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,6vw,3rem);color:var(--ink);margin-top:6px;line-height:1.05}
  .sel-heart{color:#5f6e54;margin-top:8px;line-height:0}
  .sel-heart svg{width:22px;height:22px}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(16px,4vh,40px) clamp(12px,4vw,40px);gap:clamp(16px,3.2vh,30px)}

  /* Hero: embracing crest, two stacked layers */
  .hero{position:relative;width:min(90vw,600px);aspect-ratio:var(--hero-w) / var(--hero-h)}
  .hero img{position:absolute;bottom:0;width:auto;user-select:none;-webkit-user-drag:none;
    transition:filter .55s var(--ease),opacity .55s var(--ease)}
  .hero .eagle{left:31.26%;height:100%;z-index:1}
  .hero .lion{left:0;height:100%;z-index:2}
  .glow{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 55%, rgba(95,110,84,.14), transparent 62%);transition:opacity .5s var(--ease)}

  /* invisible split hit areas over the crest */
  .hit{position:absolute;top:0;height:100%;width:50%;z-index:3;display:block;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .hit.nl{left:0}.hit.de{left:50%}
  .hit:focus-visible{box-shadow:inset 0 0 0 2px var(--gold);border-radius:10px}

  /* labels — now clickable */
  .labels{display:flex;width:min(90vw,600px)}
  .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px}
  .label-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;
    cursor:pointer;border-radius:12px;padding:8px 16px;-webkit-tap-highlight-color:transparent;
    transition:background .2s var(--ease)}
  .label-link:hover{background:rgba(95,110,84,.10)}
  .label-link:focus-visible{outline:none;box-shadow:0 0 0 2px var(--gold)}
  .meta{display:flex;align-items:center;gap:11px;transition:opacity .45s var(--ease),filter .45s var(--ease)}
  .flag{width:34px;height:23px;border-radius:2px;overflow:hidden;flex:none;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(59,51,42,.18),0 2px 6px rgba(59,51,42,.16)}
  .flag span{display:block;flex:1}
  .flag.nl span:nth-child(1){background:var(--nl-red)} .flag.nl span:nth-child(2){background:#fff} .flag.nl span:nth-child(3){background:var(--nl-blue)}
  .flag.at span:nth-child(1){background:var(--at-red)} .flag.at span:nth-child(2){background:#fff} .flag.at span:nth-child(3){background:var(--at-red)}
  .label{font-size:1.12rem;letter-spacing:.02em;color:var(--ink);transition:color .45s var(--ease)}

  .go{font-family:"Jost",sans-serif;font-size:1rem;letter-spacing:.03em;color:#fff;background:var(--gold);
    border:0;border-radius:999px;cursor:pointer;padding:11px 28px;
    opacity:0;transform:translateY(6px) scale(.96);pointer-events:none;
    transition:opacity .35s var(--ease),transform .35s var(--ease),background .2s}
  .cell.show-go .go{opacity:1;transform:none;pointer-events:auto}
  .go:hover{background:#caa02a}

  /* ===== Selection effects: the chosen side stays in colour, the other greys ===== */
  @media (hover:hover) and (pointer:fine){
    .stage:has(.choose.nl:hover) .eagle{filter:grayscale(1);opacity:.42}
    .stage:has(.choose.de:hover) .lion{filter:grayscale(1);opacity:.42}
    .stage:has(.choose.nl:hover) .cell.de .meta,
    .stage:has(.choose.de:hover) .cell.nl .meta{filter:grayscale(1);opacity:.4}
    .stage:has(.choose.nl:hover) .cell.de .label,
    .stage:has(.choose.de:hover) .cell.nl .label{color:var(--muted)}
    .stage:has(.choose.nl:hover) .cell.nl .label-link,
    .stage:has(.choose.de:hover) .cell.de .label-link{background:rgba(95,110,84,.14)}
    .stage:has(.choose:hover) .glow{opacity:1}
  }
  .stage.sel-nl .eagle{filter:grayscale(1);opacity:.42}
  .stage.sel-de .lion{filter:grayscale(1);opacity:.42}
  .stage.sel-nl .cell.de .meta,
  .stage.sel-de .cell.nl .meta{filter:grayscale(1);opacity:.4}
  .stage.sel-nl .cell.de .label,
  .stage.sel-de .cell.nl .label{color:var(--muted)}
  .stage.sel-nl .cell.nl .label-link,
  .stage.sel-de .cell.de .label-link{background:rgba(95,110,84,.14)}
  .stage.sel-nl .glow,.stage.sel-de .glow{opacity:1}

  @media (max-width:560px){.hero{width:94vw}.labels{width:94vw}.label{font-size:1rem}}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="selhead">
      <div class="sel-date">20 · 08 · 2027</div>
      <div class="sel-names">Julia &amp; Marc</div>
      <div class="sel-heart"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    </div>

    <div class="hero">
      <span class="glow" aria-hidden="true"></span>
      <img class="eagle" src="../assets/eagle.png" alt="" aria-hidden="true" draggable="false">
      <img class="lion"  src="../assets/lion.png"  alt="" aria-hidden="true" draggable="false">
      <a class="hit choose nl" href="../uitnodiging/" data-lang="nl" aria-label="Nederlands"></a>
      <a class="hit choose de" href="../einladung/" data-lang="de" aria-label="Deutsch"></a>
    </div>

    <div class="labels">
      <div class="cell nl">
        <a class="label-link choose nl" href="../uitnodiging/" data-lang="nl">
          <span class="meta"><span class="flag nl" aria-hidden="true"><span></span><span></span><span></span></span><span class="label">Nederlands</span></span>
        </a>
        <button class="go" type="button" data-go="../uitnodiging/" tabindex="-1">Ga verder</button>
      </div>
      <div class="cell de">
        <a class="label-link choose de" href="../einladung/" data-lang="de">
          <span class="meta"><span class="flag at" aria-hidden="true"><span></span><span></span><span></span></span><span class="label">Deutsch</span></span>
        </a>
        <button class="go" type="button" data-go="../einladung/" tabindex="-1">Weiter</button>
      </div>
    </div>
  </main>

<script>
(function(){
  var stage=document.getElementById('stage');
  var choose=Array.prototype.slice.call(stage.querySelectorAll('.choose'));
  var cells={nl:stage.querySelector('.cell.nl'),de:stage.querySelector('.cell.de')};
  var canHover=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  function go(href){window.location.href=href;}

  if(!canHover){
    choose.forEach(function(el){
      var lang=el.dataset.lang, href=el.getAttribute('href');
      el.addEventListener('click',function(e){
        e.preventDefault();
        if(stage.classList.contains('sel-'+lang)){go(href);return;}
        stage.classList.remove('sel-nl','sel-de');
        cells.nl.classList.remove('show-go');cells.de.classList.remove('show-go');
        stage.classList.add('sel-'+lang);
        cells[lang].classList.add('show-go');
      });
    });
    stage.querySelectorAll('.go').forEach(function(b){
      b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();go(b.dataset.go);});
    });
    // tapping an empty area (no language there) clears the current selection
    document.addEventListener('click',function(e){
      if(e.target.closest('.choose')||e.target.closest('.go'))return;
      stage.classList.remove('sel-nl','sel-de');
      cells.nl.classList.remove('show-go');cells.de.classList.remove('show-go');
    });
  }
})();
</script>
</body>
</html>
